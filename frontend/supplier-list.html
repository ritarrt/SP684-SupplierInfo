<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Supplier Information</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

  <!-- HEADER -->
  <header class="w-full h-16 bg-stone-900 flex items-center px-4 shrink-0">
    <div class="flex items-center gap-6">
      <img src="img/TangnamLogo.png" alt="Logo" class="h-11" />
      <nav class="flex items-center gap-8 text-xs text-white">
        <a href="http://192.192.0.37:3004/filter-stockstatus.html" class="hover:underline">Stock Demand - AP Item</a>
        <a href="http://192.192.0.37:5847/supplier-list.html" class="hover:underline font-bold underline">Supplier Info</a>
        <a href="http://192.192.0.37:5847/price-list.html" class="hover:underline">Price Import</a>
        <a href="http://192.192.0.37:3004/index.html" class="hover:underline">Purchase Planning</a>
        <a href="http://192.192.0.37:3004/dc-config.html" class="hover:underline">DC Items</a>
        <a href="http://192.192.0.37:3004/move-config.html" class="hover:underline">Item Transfer</a>
        <a href="http://192.192.0.37:3004/config.html" class="hover:underline">Config</a>
      </nav>
    </div>
    <div class="ml-auto flex items-center gap-4">
      <div id="userProfile" class="flex items-center gap-3 px-4 py-2 rounded-full">
        <div id="userAvatar" class="w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-full font-bold">U</div>
        <div class="text-sm leading-tight">
          <div id="userName" class="font-semibold text-white">-</div>
          <div id="userCode" class="text-white text-xs">-</div>
        </div>
      </div>
      <button id="btnLogout" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-700 text-sm">ออกจากระบบ</button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-7xl mx-auto bg-white mt-6 rounded shadow p-6">

    <h1 class="text-2xl font-bold mb-6">Supplier Information</h1>

    <!-- SEARCH INPUT -->
    <div class="mb-6">
      <input
        id="searchInput"
        placeholder="ค้นหา"
        class="border px-4 py-2 rounded w-64 text-sm"
      />
    </div>

    <!-- LOADING STATE (ยังไม่ทำงานจนกว่าจะเขียน JS) -->
    <div id="loadingBox" class="w-full flex justify-center py-10 hidden">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-300 border-t-blue-600"></div>
    </div>

    <!-- TABLE -->
    <table id="supplierTable" class="w-full text-sm">
      <thead class="border-b text-gray-400">
        <tr>
          <th class="text-left py-3">No.</th>
          <th class="text-left">Name</th>
          <th class="text-left">Category</th>
          <!-- <th class="text-left">Phone no.</th>
          <th class="text-left">Contact</th> -->
        </tr>
      </thead>
      <tbody id="supplierTableBody"></tbody>
    </table>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="text-center text-gray-400 py-4 hidden">
      ไม่พบข้อมูล Supplier
    </div>

    <!-- PAGINATION -->
    <div id="pagination" class="flex justify-center mt-4 gap-2"></div>

  </main>

  <!-- JS: ทำงานภายหลัง -->
  <script type="module" src="supplier-list.js"></script>

</body>
</html>
